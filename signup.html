<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="login-signup.css">
</head>
<body>
    <main class="container">
        <h1>Sign Up</h1>
        <p class="subtitle">Buat akun baru Anda</p>
        <form action="#" method="post">
            <div class="form-group">
                <label for="nama">Nama lengkap</label>
                <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="nama@email.com" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Buat password" minlength="8" required>
            </div>
            <div class="form-group">
                <label for="konfirmasi">Konfirmasi password</label>
                <input type="password" id="konfirmasi" name="konfirmasi" placeholder="Ulangi password" minlength="8" required>
            </div>
            <button type="submit">Buat Akun</button>
        </form>
        <p class="footer-text">Sudah punya akun? <a href="login.html">Login</a></p>
        <p class="footer-text"><a href="registrasi.html">Form Registrasi</a></p>
    </main>
</body>
</html>
